<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>IceTrack — Hi-Fi Designs</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <style>
    html, body, #root { margin: 0; height: 100%; background: #eef2f7; font-family: 'Geist', -apple-system, system-ui, sans-serif; }
  </style>

  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel" src="design-canvas.jsx"></script>
  <script type="text/babel" src="it-system.jsx"></script>
  <script type="text/babel" src="hifi-auth.jsx"></script>
  <script type="text/babel" src="hifi-parent.jsx"></script>
  <script type="text/babel" src="hifi-instructor.jsx"></script>
  <script type="text/babel" src="hifi-admin.jsx"></script>
  <script type="text/babel" src="hifi-skills.jsx"></script>
  <script type="text/babel" src="hifi-marketing.jsx"></script>

  <script type="text/babel" data-presets="react">
    function App() {
      return (
        <DesignCanvas>
          <DCSection id="marketing" title="Marketing landing">
            <DCArtboard id="m-a" label="A · Hero + stacked moments" width={1280} height={1700}>
              <ITMarketingHiFi />
            </DCArtboard>
          </DCSection>

          <DCSection id="auth" title="Auth">
            <DCArtboard id="login" label="Login · Split brand hero" width={1100} height={700}>
              <ITLoginHiFi />
            </DCArtboard>
            <DCArtboard id="register" label="Register · Multi-step / role-first" width={1100} height={700}>
              <ITRegisterHiFi />
            </DCArtboard>
          </DCSection>

          <DCSection id="parent" title="Parent dashboard">
            <DCArtboard id="parent-a" label="A · Skater cards (warm)" width={1280} height={820}>
              <ITParentHiFi />
            </DCArtboard>
          </DCSection>

          <DCSection id="instructor" title="Instructor — tablet, rink-side">
            <DCArtboard id="inst-a" label="A · Today's roster (tablet)" width={1180} height={820}>
              <ITInstructorHiFi />
            </DCArtboard>
          </DCSection>

          <DCSection id="admin" title="Admin dashboard">
            <DCArtboard id="admin-b" label="B · KPI overview + drill-in" width={1280} height={820}>
              <ITAdminHiFi />
            </DCArtboard>
          </DCSection>

          <DCSection id="skills" title="Skill tracker · the +1 feature">
            <DCArtboard id="skills-b" label="B · Parent journey (celebratory)" width={1280} height={920}>
              <ITSkillsHiFi />
            </DCArtboard>
          </DCSection>
        </DesignCanvas>
      );
    }
    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
